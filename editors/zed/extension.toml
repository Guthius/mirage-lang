id = "mirage"
name = "Mirage"
version = "0.0.1"
schema_version = 1
authors = ["Guthius"]
description = "Mirage language support: syntax highlighting and mirage-lsp integration (diagnostics, hover, go-to-definition, completion)."
repository = "https://github.com/Guthius/mirage-lang"

[grammars.mirage]
repository = "https://github.com/Guthius/tree-sitter-mirage"
# PENDING: this rev predates the '//' + '/* */' comment syntax and the '?' optional-error
# return marker. Both are implemented upstream on the 'sync-with-compiler' branch but not
# yet merged, so there is no SHA to point at. Until this is bumped, Zed highlights comments
# and '?' wrongly while VS Code (whose grammar lives in this repo) is correct.
#
# highlights.scm here is already written against the new nodes; a query that matches nothing
# is inert, so it is safe to land ahead of the bump.
rev = "3aabe5015b0c9ae8ee628b917789698eaa4c7057"

[language_servers.mirage-lsp]
name = "Mirage LSP"
languages = ["Mirage"]
